<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">workface: live brain surgery on your agent's memory</title>
  <desc id="d">A Claude Code plugin. The agent keeps its notes in a short workface file; you edit them live in a panel, omitting a stale line and adding an owner note; after compaction the agent wakes up holding the summary and its notes, and the summarizer was told not to restate them.</desc>
  <defs>
    <radialGradient id="glow" cx="0.86" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#d97757" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2028"/>
      <stop offset="1" stop-color="#13171d"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97757"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #d4d8de; white-space: pre; }
      .card { fill: url(#card); stroke: #2a313c; stroke-width: 1.5; filter: url(#shadow); }
      .chip { fill: #161a21; stroke: #2a313c; stroke-width: 1.2; }
      .chip-t { fill: #aab2bf; font-size: 15px; }
      .step { fill: #0f1115; stroke: #d97757; stroke-width: 1.5; }
      .step-n { fill: #d97757; font-size: 13px; font-weight: 700; }
      .head { fill: #8b93a1; }
      .dim { fill: #7d8590; }
      .acc { fill: #d97757; }
      .good { fill: #6cc070; }
      .warn { fill: #e5c07b; }
      .sha { fill: #d36ad6; }
      .code { fill: #6ea8fe; }
      .small { font-size: 14px; }
      .cap { fill: #c3c9d2; font-size: 22px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
      .fill { transform-box: fill-box; transform-origin: left center; animation: fill 4s ease-in-out 0.8s 1 both; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes fill { from { transform: scaleX(0.15); } to { transform: scaleX(1); } }
      @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { .blink, .flow, .fill, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="600" rx="24" fill="#0f1115"/>
  <rect width="1280" height="600" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="600" rx="24" fill="url(#glow)"/>

  <!-- title block: eyebrow, wordmark, headline, sub-line, chips -->
  <text x="72" y="64" class="mono" font-size="14" letter-spacing="3" fill="#d97757">CLAUDE CODE PLUGIN</text>
  <text x="68" y="130" class="sans" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#word)">workface<tspan class="blink" fill="#d97757">_</tspan></text>
  <text x="72" y="180" class="sans" font-size="32" font-weight="600" fill="#eef0f3">Live brain surgery on your agent's memory.</text>
  <text x="72" y="212" class="sans" font-size="19" fill="#aab2bf">Your agent keeps the notes. You control what survives compaction, in real time.</text>

  <g class="mono">
    <rect x="72" y="232" width="250" height="32" rx="16" class="chip" style="stroke:#d97757;fill:#2a1d18"/>
    <text x="197" y="253" class="chip-t" text-anchor="middle" style="fill:#f0a98c">live-editable compaction</text>
    <rect x="332" y="232" width="232" height="32" rx="16" class="chip"/>
    <text x="448" y="253" class="chip-t" text-anchor="middle">one install · no setup</text>
  </g>

  <!-- 1. the agent keeps its notes -->
  <g class="mono" transform="translate(72 286)">
    <rect width="330" height="226" rx="16" class="card"/>
    <circle cx="30" cy="30" r="12" class="step"/>
    <text x="30" y="34.5" class="step-n" text-anchor="middle">1</text>
    <text x="50" y="35" class="head">workface.md</text>
    <text x="22" y="68" class="dim">## Live state</text>
    <text x="22" y="92">- main <tspan class="sha">4f2a9c1</tspan>, CI <tspan class="good">PASS</tspan></text>
    <text x="22" y="116">- Running: migrate-store</text>
    <text x="22" y="140">- staging: stage.internal</text>
    <text x="22" y="164">- <tspan class="code">store/migrate.rs</tspan> <tspan class="warn">NOT pushed</tspan></text>
    <text x="22" y="196" class="small warn">80% · flush requested</text>
    <rect x="22" y="204" width="286" height="6" rx="3" fill="#262c36"/>
    <rect x="22" y="204" width="229" height="6" rx="3" fill="#e5c07b" class="fill"/>
  </g>

  <line x1="410" y1="399" x2="465" y2="399" stroke="#d97757" stroke-width="2.5" class="flow" marker-end="url(#head)"/>

  <!-- 2. you edit them, live: the panel -->
  <g class="mono" transform="translate(475 286)">
    <rect width="330" height="226" rx="16" class="card" style="stroke:#d97757;stroke-opacity:0.55"/>
    <circle cx="30" cy="30" r="12" class="step"/>
    <text x="30" y="34.5" class="step-n" text-anchor="middle">2</text>
    <text x="50" y="35" class="head">workface panel</text>
    <text x="22" y="62" class="small good">64/120 lines +1 new · 3m old</text>
    <text x="22" y="90">  - main <tspan class="sha">4f2a9c1</tspan>, CI <tspan class="good">PASS</tspan></text>
    <text x="308" y="90" class="dim" text-anchor="end">?  ✕</text>
    <text x="22" y="114"><tspan class="good">+</tspan> - Running: migrate-store</text>
    <text x="308" y="114" class="dim" text-anchor="end">?  ✕</text>
    <text x="22" y="138" class="dim">  - <tspan text-decoration="line-through">staging: stage.internal</tspan></text>
    <text x="308" y="138" class="dim" text-anchor="end">?  ↺</text>
    <text x="22" y="162"><tspan class="acc">◆</tspan> - ship behind store_v2</text>
    <text x="308" y="162" class="dim" text-anchor="end">?  ✕</text>
    <text x="22" y="192" class="small"><tspan class="acc">◆ note:</tspan> <tspan class="dim">owner note or decision</tspan></text>
    <line x1="92" y1="198" x2="308" y2="198" stroke="#262c36" stroke-width="1"/>
    <text x="22" y="216" class="small"><tspan class="warn">1 omitted</tspan><tspan class="dim"> from the re-attach</tspan></text>
  </g>

  <line x1="813" y1="399" x2="868" y2="399" stroke="#d97757" stroke-width="2.5" class="flow" marker-end="url(#head)"/>

  <!-- 3. it wakes up holding them -->
  <g class="mono" transform="translate(878 286)">
    <rect width="330" height="226" rx="16" class="card"/>
    <circle cx="30" cy="30" r="12" class="step"/>
    <text x="30" y="34.5" class="step-n" text-anchor="middle">3</text>
    <text x="50" y="35" class="head">context, after compaction</text>
    <rect x="22" y="52" width="286" height="40" rx="9" fill="#2b2540" stroke="#4a3f6b" stroke-width="1.5"/>
    <text x="34" y="77" fill="#c9b8ff">summary: only what's new</text>
    <rect x="22" y="104" width="286" height="86" rx="9" fill="none" stroke="#d97757" stroke-width="6" filter="url(#soft)" class="pulse"/>
    <rect x="22" y="104" width="286" height="86" rx="9" fill="#1d222b" stroke="#d97757" stroke-width="1.5"/>
    <text x="32" y="128" class="acc">workface.md · re-attached</text>
    <text x="32" y="152">- main <tspan class="sha">4f2a9c1</tspan>, CI <tspan class="good">PASS</tspan></text>
    <text x="30" y="176">- ship behind store_v2 <tspan class="dim small">⟨owner⟩</tspan></text>
    <text x="22" y="216" class="small dim">summarizer told: don't restate it</text>
  </g>

  <text x="237" y="550" class="sans cap" text-anchor="middle">The agent keeps its notes</text>
  <text x="640" y="550" class="sans cap" text-anchor="middle">You edit them, live</text>
  <text x="1043" y="550" class="sans cap" text-anchor="middle">It wakes up holding them</text>
</svg>
