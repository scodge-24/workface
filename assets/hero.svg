<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">workface</title>
  <desc id="d">A Claude Code plugin. A long-running agent fills its context; at compaction the summarizer is told what the workface already holds; the agent wakes up holding the summary and its workface.</desc>
  <defs>
    <radialGradient id="glow" cx="0.86" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#d97757" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2028"/>
      <stop offset="1" stop-color="#13171d"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97757"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .card { fill: url(#card); stroke: #2a313c; stroke-width: 1.5; filter: url(#shadow); }
      .msg-u { fill: #2a303b; }
      .msg-a { fill: #3a4250; }
      .chip { fill: #161a21; stroke: #2a313c; stroke-width: 1.2; }
      .chip-t { fill: #aab2bf; font-size: 13px; }
      .step { fill: #0f1115; stroke: #d97757; stroke-width: 1.5; }
      .step-n { fill: #d97757; font-size: 12px; font-weight: 700; }
      .head { fill: #8b93a1; font-size: 13px; }
      .cap { fill: #c3c9d2; font-size: 17px; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .flow { stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
      .fill { transform-box: fill-box; transform-origin: left center; animation: fill 7s ease-in-out infinite; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes fill { 0% { transform: scaleX(0.15); } 55%, 100% { transform: scaleX(1); } }
      @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) { .blink, .flow, .fill, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="600" rx="24" fill="#0d0f13"/>
  <rect width="1280" height="600" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="600" rx="24" fill="url(#glow)"/>

  <!-- title -->
  <text x="72" y="84" class="mono" font-size="14" letter-spacing="3" fill="#d97757">CLAUDE CODE PLUGIN</text>
  <text x="68" y="156" class="sans" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#word)">workface<tspan class="blink" fill="#d97757">_</tspan></text>
  <text x="72" y="200" class="sans" font-size="23" fill="#aab2bf">A long-running agent's working notes, kept through every compaction.</text>

  <g class="mono">
    <rect x="72" y="226" width="214" height="30" rx="15" class="chip"/>
    <text x="179" y="246" class="chip-t" text-anchor="middle">auto &amp; manual compaction</text>
    <rect x="296" y="226" width="152" height="30" rx="15" class="chip"/>
    <text x="372" y="246" class="chip-t" text-anchor="middle">summarizer dedup</text>
    <rect x="458" y="226" width="144" height="30" rx="15" class="chip"/>
    <text x="530" y="246" class="chip-t" text-anchor="middle">steerable panel</text>
    <rect x="612" y="226" width="184" height="30" rx="15" class="chip"/>
    <text x="704" y="246" class="chip-t" text-anchor="middle">owner-verified notes</text>
  </g>

  <!-- 1. the agent fills its context -->
  <rect x="72" y="290" width="330" height="230" rx="16" class="card"/>
  <circle cx="102" cy="318" r="11" class="step"/>
  <text x="102" y="322" class="mono step-n" text-anchor="middle">1</text>
  <text x="122" y="323" class="mono head">context</text>
  <rect x="94" y="344" width="178" height="9" rx="4" class="msg-u"/>
  <rect x="94" y="360" width="262" height="9" rx="4" class="msg-a"/>
  <rect x="94" y="376" width="214" height="9" rx="4" class="msg-a"/>
  <rect x="94" y="392" width="132" height="9" rx="4" class="msg-u"/>
  <rect x="94" y="408" width="286" height="9" rx="4" class="msg-a"/>
  <rect x="94" y="424" width="240" height="9" rx="4" class="msg-a"/>
  <rect x="94" y="440" width="156" height="9" rx="4" class="msg-u"/>
  <text x="94" y="482" class="mono" font-size="13" fill="#e5c07b">80% · workface flushed</text>
  <rect x="94" y="494" width="286" height="6" rx="3" fill="#262c36"/>
  <rect x="94" y="494" width="229" height="6" rx="3" fill="#e5c07b" class="fill"/>

  <line x1="410" y1="405" x2="465" y2="405" stroke="#d97757" stroke-width="2.5" class="flow" marker-end="url(#head)"/>

  <!-- 2. compaction briefs the summarizer -->
  <rect x="475" y="290" width="330" height="230" rx="16" class="card"/>
  <circle cx="505" cy="318" r="11" class="step"/>
  <text x="505" y="322" class="mono step-n" text-anchor="middle">2</text>
  <text x="525" y="323" class="mono head">compaction</text>
  <rect x="497" y="342" width="124" height="132" rx="9" fill="#1d222b" stroke="#d97757" stroke-width="1.5"/>
  <text x="509" y="364" class="mono" font-size="12" fill="#d97757">workface.md</text>
  <rect x="509" y="378" width="84" height="6" rx="3" fill="#6ea8fe"/>
  <rect x="509" y="392" width="100" height="6" rx="3" fill="#3a4250"/>
  <rect x="509" y="406" width="64" height="6" rx="3" fill="#d36ad6"/>
  <rect x="509" y="420" width="92" height="6" rx="3" fill="#3a4250"/>
  <rect x="509" y="434" width="76" height="6" rx="3" fill="#6cc070"/>
  <rect x="509" y="448" width="96" height="6" rx="3" fill="#3a4250"/>
  <line x1="625" y1="408" x2="651" y2="408" stroke="#d97757" stroke-width="2" class="flow" marker-end="url(#head)"/>
  <rect x="657" y="366" width="128" height="84" rx="11" fill="#232a35" stroke="#3a4250" stroke-width="1.5"/>
  <text x="721" y="403" class="mono" font-size="14" fill="#e6e8eb" text-anchor="middle">summarizer</text>
  <text x="721" y="425" class="mono" font-size="12" fill="#6cc070" text-anchor="middle">✓ briefed</text>
  <text x="497" y="500" class="mono" font-size="13" fill="#8b93a1">"don't restate what it holds"</text>

  <line x1="813" y1="405" x2="868" y2="405" stroke="#d97757" stroke-width="2.5" class="flow" marker-end="url(#head)"/>

  <!-- 3. the agent wakes up holding it -->
  <rect x="878" y="290" width="330" height="230" rx="16" class="card"/>
  <circle cx="908" cy="318" r="11" class="step"/>
  <text x="908" y="322" class="mono step-n" text-anchor="middle">3</text>
  <text x="928" y="323" class="mono head">context, after</text>
  <rect x="900" y="340" width="286" height="42" rx="9" fill="#2b2540" stroke="#4a3f6b" stroke-width="1.5"/>
  <text x="914" y="366" class="mono" font-size="13" fill="#c9b8ff">summary: only what's new</text>
  <rect x="900" y="394" width="286" height="80" rx="9" fill="none" stroke="#d97757" stroke-width="6" filter="url(#soft)" class="pulse"/>
  <rect x="900" y="394" width="286" height="80" rx="9" fill="#1d222b" stroke="#d97757" stroke-width="1.5"/>
  <text x="914" y="418" class="mono" font-size="13" fill="#d97757">workface.md · re-attached</text>
  <rect x="914" y="432" width="150" height="6" rx="3" fill="#6ea8fe"/>
  <rect x="914" y="446" width="206" height="6" rx="3" fill="#3a4250"/>
  <rect x="914" y="460" width="118" height="6" rx="3" fill="#d36ad6"/>
  <rect x="900" y="488" width="164" height="9" rx="4" class="msg-u"/>
  <rect x="900" y="504" width="110" height="9" rx="4" class="msg-a" opacity="0.6"/>

  <text x="237" y="560" class="sans cap" text-anchor="middle">The agent fills its context</text>
  <text x="640" y="560" class="sans cap" text-anchor="middle">The summarizer is told what it holds</text>
  <text x="1043" y="560" class="sans cap" text-anchor="middle">The agent wakes up holding it</text>
</svg>
