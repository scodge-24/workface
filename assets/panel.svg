<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d">
  <title id="t">The workface panel</title>
  <desc id="d">The Compact view of the workface panel: tabs, a stats row, sections on coloured bands, one section open with coloured shas, paths and status words, a new line marked +, an owner note marked with a diamond, an omitted line struck through, ask and omit controls on the right, and the owner note input.</desc>
  <defs>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 15px; fill: #d4d8de; white-space: pre; }
      .dim { fill: #7d8590; }
      .acc { fill: #d97757; }
      .good { fill: #6cc070; }
      .warn { fill: #e5c07b; }
      .sha { fill: #d36ad6; }
      .code { fill: #6ea8fe; }
      .time { fill: #7d8590; }
      .band { fill: #1b2029; }
    </style>
  </defs>

  <rect width="760" height="600" rx="16" fill="#0f1115"/>
  <!-- a terminal pane: rounded border with its title set into the top edge -->
  <rect x="12" y="20" width="736" height="568" rx="10" fill="none" stroke="#3a4250" stroke-width="1.5"/>
  <rect x="28" y="12" width="92" height="18" fill="#0f1115"/>
  <text x="36" y="26" class="m dim" font-size="14">Workface</text>

  <!-- header: name and close, tabs, stats -->
  <text x="32" y="80" class="m acc" font-weight="700">release-2.0</text>
  <text x="716" y="80" class="m dim">✕</text>
  <rect x="32" y="91" width="81" height="24" rx="3" fill="#2a303b"/>
  <text x="41" y="108" class="m">Compact</text>
  <text x="131" y="108" class="m dim">Full</text>
  <text x="194" y="108" class="m dim">Browse</text>
  <text x="32" y="136" class="m"><tspan class="good">64/120 lines</tspan> <tspan class="good">+3 new</tspan> <tspan class="good">· 12m old</tspan> <tspan class="sha">· 1 commit since</tspan></text>

  <!-- sections -->
  <rect x="32" y="158" width="696" height="26" class="band"/>
  <rect x="32" y="161" width="4" height="20" fill="#6ea8fe"/>
  <text x="44" y="176" class="m">▸ Doctrine and evidence <tspan class="dim">4</tspan></text>
  <text x="680" y="176" class="m dim">?  ✕</text>

  <rect x="32" y="186" width="696" height="26" class="band"/>
  <rect x="32" y="189" width="4" height="20" fill="#56b6c2"/>
  <text x="44" y="204" class="m">▸ Code seams <tspan class="dim">3</tspan></text>
  <text x="680" y="204" class="m dim">?  ✕</text>

  <rect x="32" y="214" width="696" height="26" class="band"/>
  <rect x="32" y="217" width="4" height="20" fill="#d97757"/>
  <text x="44" y="232" class="m">▾ Live state (as of 2026-10-03 14:20) <tspan class="dim">6</tspan></text>
  <text x="680" y="232" class="m dim">?  ✕</text>

  <text x="41" y="262" class="m">  - main <tspan class="sha">4f2a9c1</tspan> pushed; CI run 18823 <tspan class="good">PASS</tspan></text>
  <text x="680" y="262" class="m dim">?  ✕</text>
  <text x="41" y="288" class="m"><tspan class="good">+</tspan> - Running: wf_7b31 migrate-store, launched 13:55</text>
  <text x="680" y="288" class="m dim">?  ✕</text>
  <text x="41" y="314" class="m">  - <tspan class="code">`src/store/migrate.rs`</tspan>: 2 of 5 tables, <tspan class="warn">NOT pushed</tspan></text>
  <text x="680" y="314" class="m"><tspan class="good">✓</tspan><tspan class="dim">  ✕</tspan></text>
  <text x="41" y="340" class="m"><tspan class="acc">◆</tspan> - owner <tspan class="time">2026-10-03 14:02</tspan>: ship behind the store_v2 flag</text>
  <text x="680" y="340" class="m dim">?  ✕</text>
  <text x="41" y="366" class="m dim">  - <tspan text-decoration="line-through">staging URL is https://stage.internal/old</tspan></text>
  <text x="680" y="366" class="m dim">?  ↺</text>
  <text x="41" y="392" class="m">  <tspan class="dim">▸</tspan> Work state: <tspan class="code">`gh issue list -l release-2.0`</tspan>…</text>
  <text x="680" y="392" class="m dim">?  ✕</text>

  <rect x="32" y="410" width="696" height="26" class="band"/>
  <rect x="32" y="413" width="4" height="20" fill="#c678dd"/>
  <text x="44" y="428" class="m">▸ Policies and recipes <tspan class="dim">3</tspan></text>
  <text x="680" y="428" class="m dim">?  ✕</text>

  <rect x="32" y="438" width="696" height="26" class="band"/>
  <rect x="32" y="441" width="4" height="20" fill="#e5c07b"/>
  <text x="44" y="456" class="m">▸ Owner notes <tspan class="dim">1</tspan></text>
  <text x="680" y="456" class="m dim">?  ✕</text>

  <rect x="32" y="466" width="696" height="26" class="band"/>
  <rect x="32" y="469" width="4" height="20" fill="#98c379"/>
  <text x="44" y="484" class="m">▸ Log <tspan class="dim">9</tspan></text>
  <text x="680" y="484" class="m dim">?  ✕</text>

  <!-- owner note input and omissions -->
  <text x="32" y="530" class="m"><tspan class="acc">◆ note:</tspan> <tspan class="dim">owner note or decision</tspan></text>
  <line x1="113" y1="538" x2="728" y2="538" stroke="#262c36" stroke-width="1"/>
  <text x="32" y="566" class="m"><tspan class="warn">1 omitted</tspan> <tspan class="dim">from the re-attach · restore all</tspan></text>
</svg>
