<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <metadata>
    Source of assets/social.png (the GitHub social preview). Re-export after editing, from the repo root, with
    Playwright's headless Chromium (a double hyphen is not allowed in an XML comment, hence this element):
    chrome-headless-shell --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1280,640 --screenshot=assets/social.png file://$PWD/assets/social.svg
  </metadata>
  <defs>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 16px; fill: #d4d8de; white-space: pre; }
      .dim { fill: #7d8590; }
      .acc { fill: #d97757; }
      .good { fill: #6cc070; }
      .warn { fill: #e5c07b; }
      .sha { fill: #d36ad6; }
      .code { fill: #6ea8fe; }
      .band { fill: #1b2028; }
    </style>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2028"/>
      <stop offset="1" stop-color="#13171d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0f1115"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <text x="96" y="112" class="mono" font-size="20" letter-spacing="3" fill="#d97757">CLAUDE CODE PLUGIN</text>
  <text x="90" y="204" class="sans" font-size="100" font-weight="800" letter-spacing="-2.5" fill="url(#word)">workface</text>
  <text x="96" y="280" class="sans" font-size="44" font-weight="700" fill="#eef0f3">Live brain surgery</text>
  <text x="96" y="334" class="sans" font-size="44" font-weight="700" fill="#eef0f3">on your agent's memory.</text>
  <text x="96" y="392" class="sans" font-size="26" fill="#aab2bf">You control what compaction keeps.</text>
  <text x="96" y="428" class="sans" font-size="26" fill="#aab2bf">Agent notes that survive it, edited live.</text>
  <text x="96" y="548" class="mono" font-size="22" fill="#7d8590">github.com/scodge-24/workface</text>

  <!-- the panel: the agent's notes, with the owner's edits -->
  <g class="mono" transform="translate(728 88)">
    <rect width="456" height="464" rx="18" fill="url(#card)" stroke="#2a313c" stroke-width="2" filter="url(#shadow)"/>
    <rect x="22" y="-8" width="92" height="16" fill="#171b22"/>
    <text x="30" y="5" class="dim" font-size="14">Workface</text>

    <text x="24" y="50" class="acc" font-weight="700">release-2.0</text>
    <text x="432" y="50" class="dim" text-anchor="end">✕</text>
    <rect x="24" y="64" width="84" height="26" rx="3" fill="#2a303b"/>
    <text x="33" y="82">Compact</text>
    <text x="126" y="82" class="dim">Full</text>
    <text x="190" y="82" class="dim">Browse</text>
    <text x="24" y="112" class="good">64/120 lines +1 new · 3m old</text>

    <rect x="24" y="130" width="408" height="26" class="band"/>
    <rect x="24" y="133" width="4" height="20" fill="#d97757"/>
    <text x="36" y="148">▾ Live state <tspan class="dim">4</tspan></text>
    <text x="424" y="148" class="dim" text-anchor="end">?  ✕</text>

    <text x="32" y="180">  - main <tspan class="sha">4f2a9c1</tspan>, CI <tspan class="good">PASS</tspan></text>
    <text x="424" y="180" class="dim" text-anchor="end">?  ✕</text>
    <text x="32" y="206"><tspan class="good">+</tspan> - Running: migrate-store</text>
    <text x="424" y="206" class="dim" text-anchor="end">?  ✕</text>
    <text x="32" y="232" class="dim">  - <tspan text-decoration="line-through">staging: stage.internal</tspan></text>
    <text x="424" y="232" class="dim" text-anchor="end">?  ↺</text>
    <text x="32" y="258">  - <tspan class="code">store/migrate.rs</tspan> <tspan class="warn">NOT pushed</tspan></text>
    <text x="424" y="258" class="dim" text-anchor="end">?  ✕</text>

    <rect x="24" y="276" width="408" height="26" class="band"/>
    <rect x="24" y="279" width="4" height="20" fill="#e5c07b"/>
    <text x="36" y="294">▾ Owner notes <tspan class="dim">1</tspan></text>
    <text x="424" y="294" class="dim" text-anchor="end">?  ✕</text>

    <text x="32" y="324"><tspan class="acc">◆</tspan> - owner <tspan class="dim">14:02</tspan>: gate on store_v2</text>
    <text x="424" y="324" class="dim" text-anchor="end">?  ✕</text>

    <rect x="24" y="342" width="408" height="26" class="band"/>
    <rect x="24" y="345" width="4" height="20" fill="#98c379"/>
    <text x="36" y="360">▸ Log <tspan class="dim">9</tspan></text>
    <text x="424" y="360" class="dim" text-anchor="end">?  ✕</text>

    <text x="24" y="398"><tspan class="acc">◆ note:</tspan> <tspan class="dim">owner note or decision</tspan></text>
    <line x1="104" y1="406" x2="432" y2="406" stroke="#262c36" stroke-width="1"/>
    <text x="24" y="434"><tspan class="warn">1 omitted</tspan> <tspan class="dim">from the re-attach · restore all</tspan></text>
  </g>
</svg>
